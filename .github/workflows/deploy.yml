name: Deploy Zitadel to Lightsail (SSH)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Git branch, tag, or commit to deploy'
        required: true
        default: 'main'

jobs:
  deploy:
    name: Manual Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}

      - name: Pull Secret from AWS Secrets Manager (prod/sambhav-zitadel)
        id: fetch_secret
        env:
          AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          SECRET_NAME: prod/sambhav-zitadel
        run: |
          echo "AWS Caller Identity:"
          aws sts get-caller-identity
          echo "Fetching ${SECRET_NAME} from AWS Secrets Manager (${AWS_REGION})..."
          RAW_SECRET=$(aws secretsmanager get-secret-value \
            --region "${AWS_REGION}" \
            --secret-id "${SECRET_NAME}" \
            --query SecretString \
            --output text)

          python3 -c '
          import json, sys, shlex
          raw_json = sys.argv[1]
          data = json.loads(raw_json)
          with open(".env", "w") as f:
              for k, v in sorted(data.items()):
                  val_str = str(v)
                  if "\n" in val_str or "\r" in val_str:
                      continue
                  f.write(f"{k}={shlex.quote(val_str)}\n")
          ' "${RAW_SECRET}"

          chmod 644 .env
          echo "Generated .env successfully."

      - name: Copy deployment files to Lightsail via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME || 'ubuntu' }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_SSH_PORT || 22 }}
          source: ".env,zitadel-compose.yml,scripts,config"
          target: "/home/${{ secrets.LIGHTSAIL_USERNAME || 'ubuntu' }}/zitadel-deploy"

      - name: Execute Remote Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME || 'ubuntu' }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_SSH_PORT || 22 }}
          script: |
            set -e
            DEPLOY_SRC="/home/${{ secrets.LIGHTSAIL_USERNAME || 'ubuntu' }}/zitadel-deploy"
            sudo mkdir -p /opt/zitadel

            if [ -d "$DEPLOY_SRC" ]; then
              echo "==> Syncing deployment files to /opt/zitadel..."
              sudo cp -rf "$DEPLOY_SRC"/* /opt/zitadel/ 2>/dev/null || true
              sudo cp -rf "$DEPLOY_SRC"/.env /opt/zitadel/.env 2>/dev/null || true
              rm -rf "$DEPLOY_SRC"
            fi

            sudo chown -R root:root /opt/zitadel
            sudo chmod 600 /opt/zitadel/.env 2>/dev/null || true
            sudo chmod +x /opt/zitadel/scripts/*.sh

            if ! command -v docker >/dev/null 2>&1; then
              echo "==> Docker not detected. Bootstrapping server..."
              sudo bash /opt/zitadel/scripts/bootstrap-server.sh || true
            fi

            echo "==> Executing deploy.sh..."
            sudo /opt/zitadel/scripts/deploy.sh "${{ github.event.inputs.git_ref }}"
